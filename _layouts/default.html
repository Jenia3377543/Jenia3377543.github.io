<!doctype html>
<html lang="{{ page.lang | default: 'en' }}" dir="{{ page.dir | default: 'ltr' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} — {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <style>
    :root {
      --bg: #ffffff; --fg: #1d2127; --muted: #5d6673; --line: #e3e6ea;
      --accent: #1f9d74; --card: #f5f7f8;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111418; --fg: #e8eaed; --muted: #9aa3ad; --line: #2a3038;
              --accent: #4fd1a5; --card: #1a1f25; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    header, main, footer { max-width: 760px; margin: 0 auto; padding: 0 16px; }
    header { padding-top: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
    header a.brand { color: var(--fg); font-weight: 700; text-decoration: none; }
    nav { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 15px; }
    nav a { color: var(--muted); text-decoration: none; }
    nav a:hover, nav a[aria-current] { color: var(--accent); }
    main { padding-top: 8px; padding-bottom: 40px; overflow-wrap: anywhere; }
    h1 { font-size: 1.7rem; line-height: 1.25; margin: 24px 0 8px; }
    h2 { font-size: 1.2rem; margin: 32px 0 8px; padding-top: 8px; border-top: 1px solid var(--line); }
    a { color: var(--accent); }
    em:first-child { color: var(--muted); }
    ul { padding-inline-start: 22px; }
    code { background: var(--card); padding: 1px 5px; border-radius: 4px; font-size: .9em; }
    iframe { width: 100%; min-height: 760px; border: 0; border-radius: 12px; background: var(--card); }
    footer { padding-top: 16px; padding-bottom: 32px; border-top: 1px solid var(--line);
             color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/privacy-policy/' | relative_url }}" {% if page.url == '/privacy-policy/' %}aria-current="page"{% endif %}>Privacy policy</a>
      <a href="{{ '/terms/' | relative_url }}" {% if page.url == '/terms/' %}aria-current="page"{% endif %}>Terms of use</a>
      <a href="{{ '/bug-report/' | relative_url }}" {% if page.url == '/bug-report/' %}aria-current="page"{% endif %}>Report a bug</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>
    © {{ site.time | date: '%Y' }} {{ site.author }} · <a href="mailto:{{ site.email }}">{{ site.email }}</a>
  </footer>
</body>
</html>
